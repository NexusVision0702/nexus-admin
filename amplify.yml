version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - node -e 'const fs=require("fs"); let f=fs.readFileSync("lib/dynamodb.ts","utf8"); f=f.replace("PLACEHOLDER_ACCESS_KEY", process.env.MY_AWS_ACCESS_KEY_ID).replace("PLACEHOLDER_SECRET_KEY", process.env.MY_AWS_SECRET_ACCESS_KEY); fs.writeFileSync("lib/dynamodb.ts", f);'
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*